# samples/manifest.yaml — 28 demo scenarios for the cinematic demo.
# scenario: integer 1–28; name: short label; description: user-facing text;
# format: parser family; sample_events: lines/records; detection: rule expected;
# rule_ids: engine rule_id(s) the scenario is designed to trigger;
# severity_hint: expected incident band; iocs: seed indicators of compromise.
- { scenario: 1,  name: "SSH Brute Force → Account Compromise",
    file: scenario1_ssh_bruteforce.log,
    description: "Full SSH kill chain: brute-force failures followed by a successful login, then escalated sudo commands, encoded PowerShell download cradles, a Cron persistence write and C2 beaconing back to attack.evil.example.",
    format: syslog, sample_events: 16, detection: "Brute Force + Privilege Escalation + Malware Download + Persistence",
    severity_hint: CRITICAL, iocs: ["185.23.45.67", "attack.evil.example"],
    remediation: "Block 185.23.45.67 at the perimeter, rotate the compromised account credentials, audit sudoers and /etc/cron.d, and quarantine the host for a full forensic capture.",
    rule_ids: ["BRUTE_FORCE_001", "PRIV_ESC_001", "MAL_DOWNLOAD_EXEC_001", "MAL_POWERSHELL_001", "MAL_PERSISTENCE_001"] }
- { scenario: 2,  name: "Network Port Scan",
    file: scenario2_port_scan.log,
    description: "Repeated firewall denials from a single external source across 18 ports plus ICMP probes — classic port sweep before exploitation.",
    format: firewall, sample_events: 21, detection: "Port Scan (many ports denied)",
    severity_hint: MEDIUM, iocs: ["185.23.45.67"],
    remediation: "Confirm the source is not a legitimate scanner (Qualys/Nessus) then block at the edge; review exposed services on 10.0.0.15.",
    rule_ids: ["PORT_SCAN_001"] }
- { scenario: 3,  name: "Web Application Attack",
    file: scenario3_web_attack.log,
    description: "Mixed HTTP attack wave from a known bad actor: UNION/boolean/sleep-based SQL injection, encoded traversal reads of /etc/passwd, reflected XSS and command injection probing.",
    format: apache, sample_events: 13, detection: "Web attacks (SQL/XSS/Path/Command)",
    severity_hint: HIGH, iocs: ["185.23.45.67", "203.0.113.9"],
    remediation: "Rate-limit and block the offending sources in the WAF, parameterize all SQL, sanitize user input, and scan the application for the exposed endpoints.",
    rule_ids: ["WEB_SQLI_001", "WEB_TRAVERSAL_001", "WEB_XSS_001", "WEB_CMD_INJ_001"] }
- { scenario: 4,  name: "Windows Logon Burst + PowerShell",
    file: scenario4_windows_auth.xml,
    description: "Eight Event 4625 logon failures from 185.23.45.67, one successful 4624 logon, then repeated encoded PowerShell process creation (DownloadString against attack.evil.example, reverse shell, credential material) and a registry Run-key persistence write.",
    format: windows, sample_events: 18, detection: "Windows Failed Logon Burst + Remote PowerShell Execution + Persistence",
    severity_hint: CRITICAL, iocs: ["185.23.45.67", "attack.evil.example"],
    remediation: "Disable the breached account, block the source IP in identity-aware firewalls, hunt for the encoded payload in process creation logs, and remove the HKLM\\...\\Run SecurityUpdate value.",
    rule_ids: ["WIN_LOGON_BURST_001", "MAL_POWERSHELL_001", "MAL_PERSISTENCE_001"] }
- { scenario: 5,  name: "Nginx XSS Probing",
    file: scenario5_nginx_xss_scan.log,
    description: "Handler-level nginx request line carrying reflected-XSS payloads including exfil via fetch() to an external host.",
    format: nginx, sample_events: 3, detection: "Possible XSS Attempt",
    severity_hint: LOW, iocs: [],
    remediation: "Validate that output encoding is applied to search parameters; consider CSP headers to blunt exfiltration.",
    rule_ids: ["WEB_XSS_001"] }
- { scenario: 6,  name: "SQL Injection (Union Select)",
    file: scenario6_sql_union_attack.log,
    description: "Union-select and boolean-error injection probing of a product endpoint, with an attempt to read credit-card columns.",
    format: apache, sample_events: 4, detection: "Possible SQL Injection",
    severity_hint: MEDIUM, iocs: [],
    remediation: "Rewrite the endpoints with parameterized queries; enable logging of query parameters for post-incident review.",
    rule_ids: ["WEB_SQLI_001"] }
- { scenario: 7,  name: "Path Traversal Attempt",
    file: scenario7_path_traversal.log,
    description: "Encoded and plain directory-traversal attempts reading /etc/passwd, /etc/shadow and boot configuration.",
    format: apache, sample_events: 4, detection: "Possible Path Traversal",
    severity_hint: MEDIUM, iocs: [],
    remediation: "Normalize and validate file paths server-side; confirm web root contains no sensitive files.",
    rule_ids: ["WEB_TRAVERSAL_001"] }
- { scenario: 8,  name: "OS Command Injection",
    file: scenario8_command_injection.log,
    description: "Command injection wave chaining ;id, cat /etc/shadow and encoded PowerShell; ending in a wget payload drop from 185.23.45.67 and C2 contact with attack.evil.example.",
    format: apache, sample_events: 9, detection: "Possible Command Injection + PowerShell + Payload Download",
    severity_hint: CRITICAL, iocs: ["185.23.45.67", "attack.evil.example"],
    remediation: "Rebuild the vulnerable endpoint with allow-listed arguments and no shell interpolation; trace the dropped /tmp/x.sh binary and block the C2 domain.",
    rule_ids: ["WEB_CMD_INJ_001", "MAL_POWERSHELL_001", "MAL_DOWNLOAD_EXEC_001"] }
- { scenario: 9,  name: "Suricata IDS Alert Burst",
    file: scenario9_suricata_ids_burst.log,
    description: "Burst of Cobalt Strike beacon, Meterpreter reverse-shell, Emotet and Mimikatz alerts from one compromised host, including contact with C2 45.83.42.99 and attack.evil.example.",
    format: suricata, sample_events: 8, detection: "IDS Alert Burst (C2/Malware)",
    severity_hint: HIGH, iocs: ["45.83.42.99", "attack.evil.example"],
    remediation: "Contain the affected host immediately; collect full pcap on the C2 channel and investigate the initial access method.",
    rule_ids: ["IDS_ALERT_BURST_001"] }
- { scenario: 10, name: "Cisco ASA Port Scan",
    file: scenario10_cisco_asa_portscan.log,
    description: "Sixteen ASA 106023 denies plus a UDP probe across the service spread — systematic port scan.",
    format: cisco_asa, sample_events: 16, detection: "Port Scan (many ports denied)",
    severity_hint: HIGH, iocs: [],
    remediation: "Confirm via the ASA 'show local-host' whether the scan is active; block the scanning IP if external.",
    rule_ids: ["PORT_SCAN_001"] }
- { scenario: 11, name: "Fortinet Port Scan",
    file: scenario11_fortinet_portscan.log,
    description: "Eighteen FortiGate deny events across 17 destination ports plus UDP — reconnaissance sweep.",
    format: fortinet, sample_events: 18, detection: "Port Scan (many ports denied)",
    severity_hint: HIGH, iocs: [],
    remediation: "Enable do-not-policy detection rules or add a temporary address-group block for the scanner.",
    rule_ids: ["PORT_SCAN_001"] }
- { scenario: 12, name: "Palo Alto PAN-OS Port Scan",
    file: scenario12_paloalto_pan.log,
    description: "Seventeen PAN-OS TRAFFIC deny lines sweeping TCP/UDP services — port scan from the DMZ.",
    format: palo_alto, sample_events: 18, detection: "Port Scan (many ports denied)",
    severity_hint: HIGH, iocs: [],
    remediation: "Raise a temporary block policy for the scanning source; confirm no vulnerable service is exposed via the security rules.",
    rule_ids: ["PORT_SCAN_001"] }
- { scenario: 13, name: "Check Point Port Scan",
    file: scenario13_checkpoint.log,
    description: "Seventeen Check Point Drop events spanning the full service stack — pre-attack reconnaissance.",
    format: check_point, sample_events: 18, detection: "Port Scan (many ports denied)",
    severity_hint: HIGH, iocs: [],
    remediation: "Use the SmartView Tracker source to block the scanner; review ingress access-control rules.",
    rule_ids: ["PORT_SCAN_001"] }
- { scenario: 14, name: "AWS CloudTrail IAM Burst",
    file: scenario14_cloudtrail_iam_burst.json,
    description: "Rapid IAM mutating calls from one IP — CreateAccessKey, policy deletions, role-policy attach and a Secrets Manager read — the shape of AWS key theft.",
    format: cloudtrail, sample_events: 8, detection: "Cloud IAM Activity Burst",
    severity_hint: MEDIUM, iocs: [],
    remediation: "Treat the user 'claire' as compromised: rotate keys, revoke the create access keys, review policy changes and enable CloudTrail alerts.",
    rule_ids: ["CLOUD_IAM_001"] }
- { scenario: 15, name: "Okta Brute Force",
    file: scenario15_okta_bruteforce.json,
    description: "Eight consecutive Okta authentication failures for one user from a single IP — account-password spraying.",
    format: okta, sample_events: 8, detection: "Cloud IAM Activity Burst (Okta auth failures)",
    severity_hint: MEDIUM, iocs: [],
    remediation: "Temporarily suspend the account, enforce MFA and adaptive policy, and block the source IP in Okta network policy.",
    rule_ids: ["CLOUD_IAM_001"] }
- { scenario: 16, name: "CrowdStrike PowerShell Detections",
    file: scenario16_crowdstrike_powershell.json,
    description: "Falcon detonating on encoded PowerShell, IEX/DownloadString cradle to attack.evil.example, account creation, and a schtasks persistence write on the same host.",
    format: crowdstrike, sample_events: 6, detection: "CrowdStrike Falcon High-Severity Detection",
    severity_hint: HIGH, iocs: ["attack.evil.example", "590b972e56e9dec8e5db5f4205b717ec"],
    remediation: "Isolate the host from Falcon console, disable the created account, kill the scheduled task and collect a full memory/evidence slice for IR.",
    rule_ids: ["EDR_MALWARE_001", "MAL_POWERSHELL_001", "MAL_PERSISTENCE_001"] }
- { scenario: 17, name: "DNS Tunneling",
    file: scenario17_dns_tunneling.log,
    description: "Ten DNS queries with very long random sublabels against exfil-style names (prot_exfil, data_exfil, staging) from one client — DNS exfiltration.",
    format: dns, sample_events: 10, detection: "DNS Exfiltration / Tunneling",
    severity_hint: HIGH, iocs: [],
    remediation: "Block the malicious DNS names at the resolver, add long-label DNS alerting, and monitor outbound DNS volume to 10.99.0.70.",
    rule_ids: ["DNS_TUNNEL_001"] }
- { scenario: 18, name: "OT Sensor Alarm Storm",
    file: scenario18_ot_sensor_alarm.log,
    description: "Industrial sensors on PLC-01 and PLC-02 flagging over-temperature, over-pressure and critical level — an OT alarm storm.",
    format: ot_sensor, sample_events: 5, detection: "Industrial Sensor Alarm / Fault",
    severity_hint: HIGH, iocs: [],
    remediation: "Verify with maintenance whether the alarms are process-related or tampering; validate the sensor loop and controller firmware.",
    rule_ids: ["OT_ALARM_001"] }
- { scenario: 19, name: "SSH Brute Force (JSON array)",
    file: scenario19_ssh_bruteforce.json,
    description: "Structured JSON array of SSH events — eight failed logins from one source followed by a successful login: brute force tipping into compromise.",
    format: json, sample_events: 9, detection: "SSH/Linux Brute Force (failed logins)",
    severity_hint: HIGH, iocs: [],
    remediation: "Rotate 'admin' credentials, enable fail2ban/geo-IP blocking, and audit the session that followed the successful login.",
    rule_ids: ["BRUTE_FORCE_001"] }
- { scenario: 20, name: "Suricata EVE Alert (JSON)",
    file: scenario20_suricata_eve_alert.json,
    description: "Eight EVE-format alert records — Cobalt Strike beacons, Meterpreter shell, known C2 domain attack.evil.example and Mimikatz activity.",
    format: json, sample_events: 8, detection: "IDS Alert Burst (C2/Malware)",
    severity_hint: HIGH, iocs: ["attack.evil.example"],
    remediation: "Contain the source host, sinkhole the C2 domain at DNS, and inspect east-west traffic for the beacon pattern.",
    rule_ids: ["IDS_ALERT_BURST_001"] }
- { scenario: 21, name: "CrowdStrike EDR CSV",
    file: scenario21_crowdstrike_edr_exploit.csv,
    description: "Seven-row Falcon export showing blocked mimikatz-style credential access, IEX/DownloadString C2 cradles, ransomware volume-shadow deletion and lateral-movement mounting.",
    format: csv, sample_events: 7, detection: "CrowdStrike Falcon High-Severity Detection",
    severity_hint: HIGH, iocs: ["attack.evil.example"],
    remediation: "Isolate srv01/dbsrv02, revoke svc_backup, alert on shadow-copy deletion, and hunt for the mounted admin$ shares.",
    rule_ids: ["EDR_MALWARE_001"] }
- { scenario: 22, name: "SSH Brute Force (CSV)",
    file: scenario22_ssh_bruteforce.csv,
    description: "Six-row CSV of SSH auth events — failed logins then success: a completed brute-force compromise in structured form.",
    format: csv, sample_events: 7, detection: "SSH/Linux Brute Force (failed logins)",
    severity_hint: HIGH, iocs: [],
    remediation: "Invalidate the admin password and key, enable source-IP-based throttling, and validate the post-login session activity.",
    rule_ids: ["BRUTE_FORCE_001"] }
- { scenario: 23, name: "Command Injection (Apache)",
    file: scenario23_command_injection_sample.log,
    description: "Apache access log with chained OS command injection: ;id, pipe cat /etc/shadow, encoded PowerShell download cradles and wget/curl payload drops to known bad infrastructure.",
    format: apache, sample_events: 9, detection: "Possible Command Injection + PowerShell Payload Download",
    severity_hint: CRITICAL, iocs: ["185.23.45.67", "attack.evil.example"],
    remediation: "Patch the vulnerable application endpoint to prohibit shell metacharacters; block the C2/payload hosts and review the dropped executables.",
    rule_ids: ["WEB_CMD_INJ_001", "MAL_POWERSHELL_001", "MAL_DOWNLOAD_EXEC_001"] }
- { scenario: 24, name: "VMware ESXi Failed Login Burst",
    file: scenario24_vmware_esxi_login_burst.log,
    description: "Eight failed logins against an ESXi host from 185.23.45.67 then lockout of 'admin' and 'serviceconsole' — automated password attack.",
    format: esxi, sample_events: 10, detection: "VMware ESXi Failed Login Burst",
    severity_hint: HIGH, iocs: ["185.23.45.67"],
    remediation: "Apply DCUI/SSH lockout policies, block the source IP on the management network, and audit for past successful ESXi logins.",
    rule_ids: ["VMW_ESXI_LOGIN_BURST_001"] }
- { scenario: 25, name: "VMware vCenter Authentication Failure Burst",
    file: scenario25_vmware_vcenter_auth_burst.log,
    description: "Eight failed vCenter authentications against root and vsphere.local accounts, then lockout — credential attack on the virtualization plane.",
    format: vcenter, sample_events: 9, detection: "vCenter Authentication Failure Burst",
    severity_hint: HIGH, iocs: ["185.23.45.67"],
    remediation: "Block the source on the vCenter management interface and enforce a strong lockout policy; check SSPI/AD binds used by vCenter.",
    rule_ids: ["VMW_VCENTER_LOGIN_BURST_001"] }
- { scenario: 26, name: "VMware NSX-T Firewall Drop Scan",
    file: scenario26_vmware_nsx_firewall_scan.log,
    description: "Fifteen NSX-T edge drops from one source sweeping 15 target ports — automated port scan from the workload segment.",
    format: nsx, sample_events: 16, detection: "NSX-T Firewall Drop Scan",
    severity_hint: HIGH, iocs: [],
    remediation: "Add a temporary deny-all DFW rule for the scanning source and review east-west segmentation policy.",
    rule_ids: ["VMW_NSX_FIREWALL_SCAN_001"] }
- { scenario: 27, name: "Network Scan (Many Hosts)",
    file: scenario27_network_scan_many_hosts.log,
    description: "One source probing 12 distinct internal hosts with denied connections — subnet-wide sweep before targeted exploitation.",
    format: firewall, sample_events: 13, detection: "Network Scan (many hosts)",
    severity_hint: MEDIUM, iocs: ["185.23.45.67"],
    remediation: "Block the scanning source and verify the swept subnet contains no exposed jump hosts or management interfaces.",
    rule_ids: ["HOST_SCAN_001"] }
- { scenario: 28, name: "Persistence Mechanism",
    file: scenario28_persistence_mechanism.json,
    description: "Process telemetry installing multiple persistence mechanisms — /etc/cron.d and systemd service enablement, schtasks onlogon/onstart, registry Run key, and encoded PowerShell re-execution.",
    format: json, sample_events: 6, detection: "Persistence Mechanism Modification",
    severity_hint: HIGH, iocs: ["185.23.45.67"],
    remediation: "Remove every listed persistence entry across Linux and Windows, treat svc_bak as compromised, and re-image the host from a known-good state.",
    rule_ids: ["MAL_PERSISTENCE_001", "MAL_POWERSHELL_001"] }